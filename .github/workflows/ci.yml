# 画面テスト（contracts/ci-workflows.md）。push と pull request のたびに実行する
name: ci

on:
  push:
    # README の自動更新コミットでは動かさない（FR-030）
    paths-ignore:
      - README.md
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:unit
      # ドメインを切り替えたときに全ページが本番の設定になることを確かめる（002 FR-028）
      - name: 本番の設定でのビルドを確認
        env:
          SITE_ENV: production
          SITE_URL: https://example.com
        run: |
          npm run build
          node scripts/check-site-config.ts --expect production --url https://example.com
      # 画面テストには既定（テスト公開）の設定でビルドしたものを使う
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  e2e:
    name: e2e (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 基準画像と同じ環境（Playwright 公式イメージ）で比較する。版は package.json の @playwright/test と合わせる
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: 'true'
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright test --project="${{ matrix.browser }}-*"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
