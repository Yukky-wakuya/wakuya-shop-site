# README の進捗表・仕様一覧の自動更新（contracts/ci-workflows.md、docs/branch-protection.md §2）
# develop・main をルールセットで保護している場合は、バイパスに登録したデプロイキーで push する。
# デプロイキーが未登録なら、ワークフローのトークンで push する（保護がない場合だけ通る）
name: readme

on:
  push:
    branches: [develop, main]

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    name: update
    # 自分の更新コミットでは動かさない（FR-030）
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(readme):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.README_BOT_DEPLOY_KEY }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: README を生成してコミットする
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            if ! npm run --silent readme:generate 2> readme-error.txt; then
              {
                echo "### README の生成に失敗しました"
                echo '```'
                cat readme-error.txt
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if git diff --quiet README.md; then
              echo "README に変更はありません" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add README.md
            git commit -m "chore(readme): 進捗表を自動更新"
            if git push origin "HEAD:$BRANCH"; then
              echo "README を更新しました（${attempt} 回目）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # 先に別の push が入った場合は、最新を取り直して生成からやり直す
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
          done
          echo "push が3回とも拒否されました" >> "$GITHUB_STEP_SUMMARY"
          exit 1
